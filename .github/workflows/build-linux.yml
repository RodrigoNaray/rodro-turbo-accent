name: Compilar Linux
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Comprobar privacidad del commit y su historial
        run: /usr/bin/python3 scripts/check-publication.py
      - name: Dependencias para la ventana (solo en el runner)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev ibus dbus-x11 python3-gi gir1.2-ibus-1.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Pruebas Python
        run: |
          /usr/bin/python3 src/assets/quick_accent.py --self-test
          /usr/bin/python3 -m unittest discover -s tests -v
          /usr/bin/python3 tests/ibus_smoke.py
      - name: Formato y pruebas Rust
        run: |
          cargo fmt --all -- --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Compilar aplicación Rust
        run: /usr/bin/python3 scripts/build-release.py
      - name: Empaquetar binario y verificar privacidad del archivo
        run: /usr/bin/python3 scripts/package-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: rodro-turbo-accent-linux-x86_64
          path: |
            dist/rodro-turbo-accent-*-linux-x86_64.tar.gz
            dist/rodro-turbo-accent-*-linux-x86_64.tar.gz.sha256
